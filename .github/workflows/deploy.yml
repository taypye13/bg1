name: Deploy to GitHub Pages

on:
  push:
    branches: [ feature/llsp-manager ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create diu.ts placeholder
        run: |
          cat > src/api/diu.ts << 'EOFINNER'
          export default async function diu(_offerId: string): Promise<object> {
            return {};
          }
          EOFINNER

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
